  "phase_preprocessors_test.bzl test_kapt_phase_contract and test_ksp_phase_contract pass with identical observable goldens (basenames -kapt-gensrc.jar / -kapt-generated-class.jar / -ksp-gensrc.jar / -ksp-genclasses.jar; mnemonics KotlinKapt / KotlinKsp2).",
  "All phase_compile/aggregation/composition_test.bzl and rule_tests.bzl suites + the full kt_jvm_* build/test targets stay green; KotlinCompile still receives the combined KAPT+KSP source jars unchanged.",
